name: Security

# Vulnerability scanning across every layer that rots (ADR 38): npm deps,
# git history, container images, Dockerfiles, and the workflows themselves.
# CodeQL has its own workflow (codeql.yml); ESLint's security rules run in
# the ordinary lint job as part of `just lint` / tests.yml.
#
# Deliberately OUTSIDE the ADR 16 gate: red here means "look at this",
# never "you cannot ship". The weekly cron matters more than the PR leg for
# the CVE-shaped jobs — dependencies and base images rot while nobody pushes.
on:
  pull_request:
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Known CVEs in the dependency graph, straight from the lockfiles — npm
  # audit resolves the tree from package-lock.json, so no install is needed.
  # The gate is production deps at high+; the full report (dev deps, all
  # severities) prints as information but never fails, because a moderate
  # advisory in a test-only tool is a chore, not an incident.
  npm-audit:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: [web, backend]
    defaults:
      run:
        working-directory: ${{ matrix.package }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Full report (never fails)
        run: npm audit || true
      - name: Gate — production deps, high or critical
        run: npm audit --omit=dev --audit-level=high

  # Injection patterns, unsafe APIs, Express misconfigurations in first-party
  # code. Community rules only — no token, no cloud account; --metrics=off
  # keeps the run fully offline. node_modules is not in the checkout, so the
  # scan naturally covers only our own sources.
  semgrep:
    runs-on: ubuntu-latest
    container:
      # Tag-pinned like every action ref in this repo (ADR 16 house style);
      # Dependabot's docker ecosystem does not watch workflow containers, so
      # bump this by hand when Semgrep announces a floor we care about.
      image: semgrep/semgrep:1.171.0
    steps:
      - uses: actions/checkout@v7
      # The one excluded rule is the tag-vs-SHA pinning policy — this repo
      # pins actions by tag on purpose (ADR 16 house style; ADR 38 records
      # the trade, zizmor's config carries the same relaxation).
      - run: >
          semgrep scan
          --config p/default
          --config p/typescript
          --config p/expressjs
          --exclude-rule yaml.github-actions.security.github-actions-mutable-action-tag.github-actions-mutable-action-tag
          --error --metrics=off
        env:
          SEMGREP_ENABLE_VERSION_CHECK: "0"

  # Committed credentials, over the FULL history — fetch-depth: 0 is
  # load-bearing: with the default shallow clone gitleaks scans one commit
  # and reports a clean lie. The one deliberate allowlist entry (ADR 11's
  # localhost-only dev SESSION_SECRET) lives in .gitleaks.toml.
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # CVEs inside the built images — OS packages AND the node_modules the
  # runtime stage actually ships. Each tier builds from its own context
  # (ADR 22), single-arch with ci.yml's exact gha cache scope so the layers
  # are shared with the PR image-build job, not duplicated.
  # ignore-unfixed: an alpine CVE with no released fix is noise nobody can
  # act on; the weekly cron re-checks once a fix exists.
  trivy:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: web
            context: web
          - name: api
            context: backend
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build the ${{ matrix.name }} image (local only)
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          platforms: linux/amd64
          push: false
          load: true
          tags: glu-${{ matrix.name }}:scan
          cache-from: type=gha,scope=${{ matrix.name }}-linux-amd64
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}-linux-amd64
      - name: Scan the ${{ matrix.name }} image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: glu-${{ matrix.name }}:scan
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

  # Dockerfile lint — privilege and config mistakes the build itself never
  # catches. Any future ignore goes inline in the Dockerfile with a reason.
  hadolint:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        dockerfile: [web/Dockerfile, backend/Dockerfile]
    steps:
      - uses: actions/checkout@v7
      - uses: hadolint/hadolint-action@v3.3.0
        with:
          dockerfile: ${{ matrix.dockerfile }}

  # The workflows themselves: actionlint for correctness (expression typos,
  # invalid matrix keys), zizmor for security posture (expression injection,
  # excess permissions). zizmor's pin policy is relaxed to tag-pins in
  # .github/zizmor.yml — this repo pins by tag everywhere (ADR 16 house
  # style; ADR 38 records the trade).
  workflows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: actionlint
        run: >
          docker run --rm -v "$PWD":/repo --workdir /repo
          rhysd/actionlint:1.7.7 -color
      - name: zizmor
        # medium+: the low tier is dominated by low-confidence artipacked
        # notes (persist-credentials on every checkout) across the ADR 16
        # workflows — accepted posture, recorded in ADR 38. Run zizmor by
        # hand (docs/security-scanning.md) to see the full list.
        run: |
          pipx install zizmor
          zizmor --min-severity medium .github/workflows
